name: 🫣 Android CI

on:
  push:
    branches: [ "main", "custom-resynthetic-release", "custom-rethink-release" ]
  pull_request:
    branches: [ "main", "custom-rethink-release" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Safe, de-Googled build that doesn't require Firebase secrets
      VARIANT: assembleFdroidFullRelease
    steps:
    - name: 🥏 Checkout
      uses: actions/checkout@v4
          
    - name: ☕️ JDKv17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: ⚡️ +x gradlew
      run: chmod +x gradlew
            
    - name: 🚂 Assemble Release
      if: success()
      run: |
        ./gradlew lint
        ./gradlew \
          ${VARIANT} \
          --info \
          --warning-mode all
      env:
        VARIANT: ${{ env.VARIANT }}

    - name: 📥 Install Legacy Build Tools
      if: success()
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"
        
    - name: 🔐 Sign Release APKs
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/fdroidFull/release
        signingKeyBase64: ${{ secrets.SIGN_KEY_BASE64 }}
        alias: ${{ secrets.SIGN_ALIAS }}
        keyStorePassword: ${{ secrets.SIGN_STORE_PASS }}
        keyPassword: ${{ secrets.SIGN_KEY_PASS }}
        
    - name: 📦 Upload Signed APKs
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: rethink-signed-release-apks
        # Grabs every single signed APK instead of just one
        path: app/build/outputs/apk/fdroidFull/release/*.apk
